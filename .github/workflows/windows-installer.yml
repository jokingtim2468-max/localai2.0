name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [claude/amazing-keller-dvibe7]
    paths: ["updater.py", "install.ps1", "nightcrew/**", "eclipse/dist/**", "static/**", "desktop.py", "requirements.txt", "packaging/**", "assets/**", "blender_workflow/**", ".github/workflows/windows-installer.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1
      - name: Tests
        run: python -m pytest -q tests
      - name: Stamp build
        run: python -c "import os; open('version.txt', 'w').write(os.environ['GITHUB_SHA']); print(os.path.abspath('version.txt'))"
      - name: Build Eclipse.exe (one folder, no console)
        run: >
          pyinstaller --noconfirm --windowed --name Eclipse --icon assets/icon.ico
          --add-data "nightcrew/skills;nightcrew/skills" --add-data "static;static"
          --add-data "eclipse/dist;eclipse/dist" --add-data "blender_workflow;blender_workflow"
          --add-data "assets;assets" --add-data "scripts;scripts" --add-data "version.txt;."
          --hidden-import updater
          --collect-submodules nightcrew --collect-all webview --collect-all trafilatura
          desktop.py
      - name: Smoke test the exe's core
        shell: pwsh
        run: |
          $env:ECLIPSE_NO_UPDATE = "1"
          $p = Start-Process dist\Eclipse\Eclipse.exe -PassThru
          Start-Sleep 12
          if ($p.HasExited) { throw "Eclipse.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\eclipse.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: EclipseSetup, path: dist-installer/EclipseSetup.exe }
      - name: Publish as the "eclipse-latest" release (replaces the previous build)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete eclipse-latest --yes --cleanup-tag 2>$null
          gh release create eclipse-latest dist-installer/EclipseSetup.exe install.ps1 --prerelease --target $env:GITHUB_SHA `
            --title "Eclipse (latest build)" --notes "Latest Windows build. build: $env:GITHUB_SHA"
